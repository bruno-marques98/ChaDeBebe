<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista do bebé</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#1f2a44;--mute:#6b7691;--line:#d9e1e8;--accent:#3f6fd8;--ok:#2f8f6b;--sun:#f7d56b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 80px}
h1{font:700 2rem/1.15 Fraunces,Georgia,serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 1rem Nunito;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
h2{font:600 1.1rem Fraunces,serif;margin:20px 0 8px;color:var(--mute)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.item .n{flex:1}.item .n small{display:block;color:var(--mute)}
.item.taken{background:#f4f7f9}
.item.taken .n b{text-decoration:line-through;color:var(--mute)}
button.act{border:0;border-radius:10px;padding:8px 12px;font:700 .9rem Nunito;cursor:pointer;background:var(--sun);color:var(--ink)}
button.act.sec{background:#e4eaf0}
button.act.bad{background:#fde3e3;color:#a22}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{color:var(--mute);padding:24px;text-align:center;border:2px dashed var(--line);border-radius:14px}
.admin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.admin form{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input{flex:1;min-width:140px}
footer{margin-top:32px;text-align:center}
footer a,footer button.link{color:var(--mute);background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer}
#qr{display:inline-block;padding:12px;background:#fff;border-radius:12px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none}
@media print{body *{visibility:hidden}#qrbox,#qrbox *{visibility:visible}#qrbox{position:absolute;left:0;top:0;width:100%;text-align:center}}
</style>
</head>
<body>
<main>
  <h1>Lista do bebé</h1>
  <p class="sub">Vê o que ainda falta e marca o que vais comprar, para não haver repetidos.</p>

  <section id="adminPanel" class="admin" hidden>
    <form id="addForm">
      <input id="newName" placeholder="Novo item (ex.: Babygrows tamanho 56)" required>
      <input id="newCat" list="cats" placeholder="Categoria" required>
      <datalist id="cats"></datalist>
      <select id="newStatus"><option value="need">Precisamos</option><option value="have">Já temos</option></select>
      <button class="act" type="submit">Adicionar item</button>
    </form>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabNeed" aria-selected="true">Precisamos</button>
    <button role="tab" id="tabHave" aria-selected="false">Já temos</button>
  </div>
  <div id="list"></div>

  <section id="qrbox" style="text-align:center;margin-top:32px">
    <h2>Partilha esta lista</h2>
    <div id="qr"></div><br>
    <button class="act sec" id="printQr" type="button">Imprimir QR code</button>
  </section>
  <footer><button class="link" id="loginBtn">Gerir lista</button><button class="link" id="logout" hidden type="button">Sair</button></footer>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,deleteField}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2XM8T8iPX6Afe887xBnY5JkF1oFYqSKc",
  authDomain: "listachadebebe.firebaseapp.com",
  projectId: "listachadebebe",
  storageBucket: "listachadebebe.firebasestorage.app",
  messagingSenderId: "797834544009",
  appId: "1:797834544009:web:e6bc2bd57969969a151758"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {experimentalForceLongPolling: true, useFetchStreams: false});
const auth = getAuth(app);
const items = collection(db, "items");
const $ = id => document.getElementById(id);
new QRCode($("qr"),{text:location.origin+location.pathname,width:180,height:180});

let all = [], tab = "need", isAdmin = false;
let me = localStorage.getItem("guestName") || "";

const toast = msg => { const t=$("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",2500); };

onSnapshot(items, snap => {
  all = snap.docs.map(d => ({id:d.id, ...d.data()}))
    .sort((a,b) => (a.category||"").localeCompare(b.category||"","pt") || (a.name||"").localeCompare(b.name||"","pt"));
  $("cats").innerHTML = [...new Set(all.map(i=>i.category))].map(c=>`<option value="${esc(c)}">`).join("");
  render();
}, err => { console.error(err); toast("Erro ao carregar: " + err.code); });

onAuthStateChanged(auth, u => {
  isAdmin = !!u;
  $("adminPanel").hidden = !isAdmin;
  $("loginBtn").hidden = isAdmin;
  $("logout").hidden = !isAdmin;
  render();
});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(){
  const rows = all.filter(i => i.status === tab);
  if (!rows.length) { $("list").innerHTML = `<div class="empty">${tab==="need"?"Ainda não há itens a pedir.":"Ainda não há itens nesta lista."}</div>`; return; }
  const byCat = {};
  rows.forEach(i => (byCat[i.category] ||= []).push(i));
  $("list").innerHTML = Object.keys(byCat).map(cat => `<h2>${esc(cat)}</h2>` + byCat[cat].map(i => {
    const taken = i.claimedBy;
    const mine = taken && taken === me;
    let actions = "";
    if (tab === "need" && !isAdmin) {
      actions = !taken ? `<button class="act" data-a="claim" data-id="${i.id}">Vou comprar</button>`
              : mine ? `<button class="act sec" data-a="unclaim" data-id="${i.id}">Desistir</button>` : "";
    }
    if (isAdmin) {
      actions = `<button class="act sec" data-a="toggle" data-id="${i.id}">${i.status==="need"?"Já temos":"Precisamos"}</button>`
        + (taken ? `<button class="act sec" data-a="unclaim" data-id="${i.id}">Libertar</button>` : "")
        + `<button class="act bad" data-a="del" data-id="${i.id}">Apagar</button>`;
    }
    return `<div class="item ${taken&&tab==="need"?"taken":""}"><div class="n"><b>${esc(i.name)}</b>${taken&&tab==="need"?`<small>${esc(taken)} vai comprar</small>`:""}</div>${actions}</div>`;
  }).join("")).join("");
}

$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const ref = doc(db, "items", b.dataset.id), a = b.dataset.a;
  try {
    if (a === "claim") {
      let n = me || (prompt("Qual é o teu nome?") || "").trim();
      if (!n) return;
      me = n; localStorage.setItem("guestName", n);
      await updateDoc(ref, {claimedBy: n});
      toast("Obrigado! Ficou marcado.");
    } else if (a === "unclaim") await updateDoc(ref, {claimedBy: deleteField()});
    else if (a === "toggle") { const it=all.find(i=>i.id===b.dataset.id); await updateDoc(ref,{status:it.status==="need"?"have":"need",claimedBy:deleteField()}); }
    else if (a === "del" && confirm("Apagar este item?")) await deleteDoc(ref);
  } catch { toast("Não foi possível guardar. Tenta outra vez."); }
});

$("tabNeed").onclick = () => setTab("need");
$("tabHave").onclick = () => setTab("have");
function setTab(t){ tab=t; $("tabNeed").setAttribute("aria-selected",t==="need"); $("tabHave").setAttribute("aria-selected",t==="have"); render(); }

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    await addDoc(items, {name:$("newName").value.trim(), category:$("newCat").value.trim(), status:$("newStatus").value, created:serverTimestamp()});
    $("newName").value=""; $("newName").focus();
  } catch { toast("Não foi possível adicionar."); }
});

$("loginBtn").onclick = async () => {
  const email = prompt("Email de administrador:"); if (!email) return;
  const pass = prompt("Palavra-passe:"); if (!pass) return;
  try { await signInWithEmailAndPassword(auth, email.trim(), pass); }
  catch { toast("Email ou palavra-passe incorretos."); }
};
$("logout").onclick = () => signOut(auth);
$("printQr").onclick = () => window.print();
</script>
</body>
</html>
